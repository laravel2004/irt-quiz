services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irt_quiz_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # SERVER_NAME is required by FrankenPHP to serve requests
      SERVER_NAME: ":80"
      FRANKENPHP_CONFIG: |
        num_threads 2
        max_threads 2
        max_wait_time 10s
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: daily
      LOG_LEVEL: warning
      LOG_DAILY_DAYS: 14
      EXAM_CONCURRENT_LIMIT: 800
      # DB Connection to internal network
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M # Limit app to 512MB
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: irt_quiz_redis
    restart: unless-stopped
    # Limit Redis memory directly in Redis config
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M # Limit container to 300MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: irt_quiz_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be a non-root user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    # Optimize MySQL for low memory (2GB RAM total system)
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --performance-schema=off
      --innodb-log-buffer-size=16M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 600M # Limit container to 600MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Queue worker for Laravel background jobs
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irt_quiz_queue
    restart: unless-stopped
    command: >
      php -d memory_limit=192M artisan queue:work
      --sleep=1
      --tries=2
      --backoff=30
      --timeout=180
      --memory=192
      --max-jobs=20
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: daily
      LOG_LEVEL: warning
      LOG_DAILY_DAYS: 14
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      REDIS_QUEUE_RETRY_AFTER: 240
    depends_on:
      - app
      - redis
      - mysql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  mysql_data:
  app_storage:
