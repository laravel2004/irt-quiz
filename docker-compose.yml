version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irt_quiz_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # SERVER_NAME is required by FrankenPHP to serve requests
      SERVER_NAME: ":80"
      APP_ENV: production
      APP_DEBUG: "false"
      # DB Connection to internal network
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M # Limit app to 512MB
        reservations:
          memory: 256M

  redis:
    image: redis:alpine
    container_name: irt_quiz_redis
    restart: unless-stopped
    # Limit Redis memory directly in Redis config
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M # Limit container to 300MB

  mysql:
    image: mysql:8.0
    container_name: irt_quiz_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_irt_quiz}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-@Agungdwin2004}
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Optimize MySQL for low memory (2GB RAM total system)
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --performance-schema=off
      --innodb-log-buffer-size=16M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 600M # Limit container to 600MB

  # (Optional) queue worker for Laravel if you are using background jobs
  # queue:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: irt_quiz_queue
  #   restart: unless-stopped
  #   command: php artisan queue:work --sleep=3 --tries=3
  #   env_file:
  #     - .env
  #   environment:
  #     DB_HOST: mysql
  #     REDIS_HOST: redis
  #     QUEUE_CONNECTION: redis
  #   depends_on:
  #     - app
  #     - redis
  #     - mysql
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.5'
  #         memory: 256M

volumes:
  redis_data:
  mysql_data:
  app_storage:
